<meta charset="UTF-8">

<title>Religious Verse Extractor</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f4f4f4;
}

.container {
    text-align: center;
}

.textarea-wrapper {
    position: relative;
    width: 450px;
    height: 350px;
}

textarea {
    width: 100%;
    height: 100%;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 10px;
    font-size: 14px;
    resize: none;
    box-sizing: border-box;
}

#sortButton {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.6);
    opacity: 0;
    visibility: hidden;
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background: #4CAF50;
    color: white;
    cursor: pointer;
    transition: 0.3s;
}

#sortButton.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -50%) scale(1);
}
</style>
</head>

<body>

<div class="container">
<h2>Religious Verse Extractor</h2>

<div class="textarea-wrapper">
<textarea id="inputText" placeholder="Paste here..."></textarea>
<button id="sortButton" onclick="handleClick()">🆗 Process</button>
</div>
</div>

const oldTestamentBooks = [
"Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth",
"1 Samuel","2 Samuel","1 Kings","2 Kings","1 Chronicles","2 Chronicles","Ezra",
"Nehemiah","Esther","Job","Psalm","Proverbs","Ecclesiastes","Song Of Solomon","Isaiah",
"Jeremiah","Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah",
"Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah","Malachi"
];

const newTestamentBooks = [
"Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians",
"Galatians","Ephesians","Philippians","Colossians","1 Thessalonians","2 Thessalonians",
"1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter",
"1 John","2 John","3 John","Jude","Revelation"
];

function processText() {

    const input = document.getElementById("inputText").value;

    const lines = [...new Set(input.split("\n").map(l => l.trim()).filter(Boolean))];

    let output = [];

    for (let line of lines) {

        let norm = line.toLowerCase();
        let matched = false;

        // ================= QURAN =================
        let direct = line.match(
    /(?:quran|surah)?\s*(\d+)\s*:\s*((?:\d+(?:\s*[-–—]\s*\d+)?)(?:\s*[,;&]\s*\d+(?:\s*[-–—]\s*\d+)?)*)/i
);

if (direct) {
    const surahNum = parseInt(direct[1]);

    const verses = direct[2]
        .replace(/\s+/g, "")
        .replace(/[–—]/g, "-")
        .replace(/[;&]/g, ",");

    const surah = quranSurahs.find(s => s.num === surahNum);

    if (surah) {
        output.push(`Surah ${surah.name} ${surah.num}:${verses} ().`);
        continue;
    }
}

if (false)

        if (direct) {
            let surahNum = parseInt(direct[1]);
            let verse = direct[2];

            let surah = quranSurahs.find(s => s.num === surahNum);

            if (surah) {
                output.push(`Surah ${surah.name} ${surah.num}:${verse} ().`);
                continue;
            }
        }

        for (let surah of quranSurahs) {
            if (norm.includes(surah.name.toLowerCase())) {

                let match = line.match(/(\d+(?:\s*[-–—]\s*\d+)?(?:\s*[,;&]\s*\d+(?:\s*[-–—]\s*\d+)?)*)/);

                let verse = match
                    ? match[1]
                        .replace(/\s+/g, "")
                        .replace(/[–—]/g, "-")
                        .replace(/[;&]/g, ",")
                    : "";

                output.push(`Surah ${surah.name} ${surah.num}${verse ? ":" + verse : ":"} ().`);
                matched = true;
                break;
            }
        }

        if (matched) continue;

        // ================= OLD TESTAMENT =================
        for (let b of oldTestamentBooks) {
            if (line.startsWith(b)) {
                let versePart = line.slice(b.length).trim();
                output.push(`${b} ${versePart} ().`);
                matched = true;
                break;
            }
        }

        if (matched) continue;

        // ================= NEW TESTAMENT =================
        for (let b of newTestamentBooks) {
            if (line.startsWith(b)) {
                let versePart = line.slice(b.length).trim();
                output.push(`${b} ${versePart} ().`);
                matched = true;
                break;
            }
        }

        if (!matched) output.push(line);
    }

    document.getElementById("inputText").value = output.join("\n");
}

async function handleClick() {
    const textArea = document.getElementById("inputText");
    const btn = document.getElementById("sortButton");

    processText();

    await navigator.clipboard.writeText(textArea.value);

    btn.textContent = "✔️ Copied";

    setTimeout(() => {
        textArea.value = "";
        btn.textContent = "🆗 Process";
        btn.classList.remove("show");
    }, 1200);
}

document.getElementById("inputText").addEventListener("input", (e) => {
    const btn = document.getElementById("sortButton");

    if (e.target.value.trim()) {
        setTimeout(() => btn.classList.add("show"), 300);
    } else {
        btn.classList.remove("show");
    }
});

</script>
